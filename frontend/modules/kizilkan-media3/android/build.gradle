plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kizilkan.media3'
version = '9.17.1'

android {
  namespace "com.kizilkan.media3"

  // v9.17.1 — Expo Module Gradle plugin publication metadata'sı
  // android.defaultConfig.versionName bekliyor. v9.17.0 build'i bu alan
  // olmadığı için Kotlin compile başlamadan configuration aşamasında durmuştu.
  defaultConfig {
    versionName "9.17.1"
  }
}

dependencies {
  // expo-video 3.0.x ile aynı Media3 ailesini Gradle conflict-resolution altında
  // paylaşır. Sürüm tek noktadan değiştirilebilir; app dependencyInsight gate'i
  // nihai APK'da tek Media3 sürümü kaldığını doğrular.
  def media3Version = "1.8.0"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
}
